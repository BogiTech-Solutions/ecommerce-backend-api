# 1. Custom Application Configuration (Bound to EnvConfig record)
app:
  security:
    jwt:
      secret: ${SECURITY_JWT_SECRET}
      expiration: ${SECURITY_JWT_EXPIRATION}
  payment:
    stripe:
      secret-key: ${STRIPE_SECRET_KEY}
    chapa:
      secret-key: ${CHAPA_SECRET_KEY}
  file:
    upload-dir: ${FILE_UPLOAD_DIR}

# 2. Standard Spring Framework Configuration (Must be at root level)
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update

application:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION_MS:86400000}

payment:
  stripe:
    secret-key: ${STRIPE_SECRET_KEY}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  chapa:
    secret-key: ${CHAPA_SECRET_KEY}
    webhook-secret: ${CHAPA_WEBHOOK_SECRET}
    base-url: https://api.chapa.co/v1
security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION_MS:86400000}
file:
  upload-dir: ./uploads
