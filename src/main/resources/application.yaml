server:
  port: 8080

spring:
  application:
    name: ecommerce-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: ERROR
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
application:
  security:
    jwt:
      secret: ${JWT_SECRET:default_jwt_secret_key_change_me_in_prod_1234567890}
      expiration: ${JWT_EXPIRATION_MS:86400000} # 24 hours
payment:
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_test_placeholder}
  chapa:
    secret-key: ${CHAPA_SECRET_KEY:CHASECK_TEST_placeholder}
    webhook-secret: ${CHAPA_WEBHOOK_SECRET:chapa_webhook_secret_placeholder}
    base-url: https://api.chapa.co/v1
