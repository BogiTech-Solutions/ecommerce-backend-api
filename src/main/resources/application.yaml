# 1. Custom Application Configuration (Bound to EnvConfig record)
app:
  security:
    jwt:
      secret: ${SECURITY_JWT_SECRET}
      expiration: ${SECURITY_JWT_EXPIRATION:86400000}
  payment:
    stripe:
      secret-key: ${STRIPE_SECRET_KEY}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET}
    chapa:
      secret-key: ${CHAPA_SECRET_KEY}
      webhook-secret: ${CHAPA_WEBHOOK_SECRET}
      base-url: https://api.chapa.co/v1
  file:
    upload-dir: ./uploads
# 2. Standard Spring Framework Configuration (Must be at root level)
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
server:
  port: ${PORT:8080}
